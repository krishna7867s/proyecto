<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear usuario - Dali Medica</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">dali medica</div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contactos.html">Contactos</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>Crear usuario</h1>
    <form id="signup">
      <label>Usuario o correo electrónico</label>
      <input id="usuario" type="text" required>
      <label>Contraseña</label>
      <div style="position:relative;">
        <input id="password" type="password" required autocomplete="current-password" style="width:100%;padding-right:40px;">
        <button type="button" id="togglePassword" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;">👁️</button>
      </div>
      <button type="submit">Crear usuario</button>
    </form>
    <p id="msg"></p>
  </main>

  <footer>
    <p class="footer-copy">&copy; 2026 Dali Medica — Página pública</p>
  </footer>

  <script src="../../Pagina-JS/storage.js"></script>
  <script src="../../Pagina-JS/auth.js"></script>
  <script>inicializarRegistro();</script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
