<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Dali Medica</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f5f7fb}
    .page{max-width:420px;margin:80px auto;padding:24px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    h1{margin:0 0 18px;font-size:24px;color:#1a73e8}
    label{display:block;margin-bottom:8px;font-weight:600}
    input{width:100%;padding:10px;margin-bottom:16px;border:1px solid #ccc;border-radius:8px}
    button{width:100%;padding:12px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:16px;cursor:pointer}
    p{margin:12px 0 0;color:#333}
    .link{margin-top:14px;font-size:14px;color:#555}
    .error{color:#c00;font-weight:700}
  </style>
</head>
<body>
  <div class="page">
    <h1>Iniciar sesión</h1>
    <form id="formLogin">
      <label for="usuario">Usuario</label>
      <input id="usuario" type="email" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" required>
      <button type="submit">Entrar</button>
      <p id="mensajeError" class="error" aria-live="polite" style="display:none"></p>
    </form>
    <p class="link">¿No tienes cuenta? <a href="crear_usuario.html">Crear usuario</a></p>
  </div>

  <script src="../../Pagina-JS/auth.js"></script>
</body>
</html>
