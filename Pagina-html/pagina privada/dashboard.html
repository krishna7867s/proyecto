<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard - Dali Medica</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:0}header{display:flex;justify-content:space-between;padding:12px 20px;background:#eef6ff}.logo{font-weight:700;color:#1a73e8}nav a{margin-left:12px;text-decoration:none;color:#333}.container{padding:24px}.menu{display:flex;gap:12px}</style>
</head>
<body>
  <header>
    <div class="logo">dali medica - privado</div>
    <nav class="menu">
      <ul style="list-style:none;display:flex;gap:12px;margin:0;padding:0;">
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="horarios.html">Horarios</a></li>
        <li><a href="administrar.html">Administrar</a></li>
        <li><a href="#" id="logout">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>Panel de administración</h1>
    <p id="welcome"></p>
    <section>
      <p>Desde aquí puedes organizar clientes, horarios y administrar la tienda.</p>
      <ul>
        <li><a href="clientes.html">Gestionar clientes</a></li>
        <li><a href="horarios.html">Gestionar horarios</a></li>
        <li><a href="administrar.html">Ajustes administrativos</a></li>
      </ul>
    </section>
  </main>

  <footer>
    <p style="text-align:center;margin:0;padding:18px 24px;background:#eef6ff;color:#666;font-size:14px;">&copy; 2026 Dali Medica — Área privada</p>
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem('dali_user')||'null');
    if(!user){ window.location.href = '../pagina%20publica/index.html'; }
    document.getElementById('welcome').textContent = user? 'Bienvenido, '+user.email : '';
    document.getElementById('logout').addEventListener('click', function(e){
      e.preventDefault(); localStorage.removeItem('dali_user'); window.location.href = '../pagina%20publica/index.html';
    });
  </script>
</body>
</html>
