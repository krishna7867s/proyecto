<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear usuario - Dali Medica</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:0}header{display:flex;justify-content:space-between;padding:12px 20px;background:#f7f7f7}.logo{font-weight:700;color:#1a73e8}nav a{margin-left:16px;text-decoration:none;color:#333}.container{padding:24px}form{max-width:380px}label{display:block;margin-top:10px}input{width:100%;padding:8px;margin-top:6px;border:1px solid #ddd;border-radius:4px}button{margin-top:12px;padding:8px 12px}</style>
</head>
<body>
  <header>
    <div class="logo">dali medica</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contactos.html">Contactos</a>
      <a href="crear_usuario.html">Iniciar sesión</a>
    </nav>
  </header>
  <main class="container">
    <h1>Crear usuario</h1>
    <form id="signup">
      <label>Correo</label>
      <input id="email" type="email" required>
      <label>Contraseña</label>
      <input id="password" type="password" required>
      <button type="submit">Crear usuario</button>
    </form>
    <p id="msg" style="color:green"></p>
  </main>

  <script>
    document.getElementById('signup').addEventListener('submit', function(e){
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('password').value;
      if(!email||!pwd){return}
      const user = {email:email};
      localStorage.setItem('dali_user', JSON.stringify(user));
      document.getElementById('msg').textContent = 'Usuario creado. Redirigiendo...';
      setTimeout(()=>{
        window.location.href = '../pagina%20privada/dashboard.html';
      },800);
    });
  </script>
</body>
</html>
