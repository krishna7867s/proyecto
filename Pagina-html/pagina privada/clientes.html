<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clientes - Dali Medica</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:0}.container{padding:24px}header{display:flex;justify-content:space-between;padding:12px 20px;background:#eef6ff}.logo{font-weight:700;color:#1a73e8}table{width:100%;border-collapse:collapse}th,td{padding:8px;border:1px solid #ddd}</style>
</head>
<body>
  <header>
    <div class="logo">dali medica - privado</div>
    <nav>
      <ul style="list-style:none;display:flex;margin:0;padding:0;">
        <li><a href="dashboard.html">Volver</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>Clientes</h1>
    <p>Registra y administra clientes desde este formulario.</p>
    <form id="clientForm">
      <input type="hidden" id="clientId">
      <label for="clientName">Nombre</label>
      <input id="clientName" required>
      <label for="clientEmail">Correo</label>
      <input id="clientEmail" type="email" required>
      <label for="clientPhone">Teléfono</label>
      <input id="clientPhone" required>
      <label for="clientNotes">Notas</label>
      <textarea id="clientNotes" rows="3"></textarea>
      <button type="submit">Guardar cliente</button>
    </form>
    <table>
      <thead>
        <tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Notas</th><th>Acciones</th></tr>
      </thead>
      <tbody id="clientList"></tbody>
    </table>
  </main>
  <footer>
    <p style="text-align:center;margin:0;padding:18px 24px;background:#eef6ff;color:#666;font-size:14px;">&copy; 2026 Dali Medica — Área privada</p>
  </footer>
  <script src="../../Pagina-JS/auth.js"></script>
  <script src="../../Pagina-JS/clientes.js"></script>
</body>
</html>
