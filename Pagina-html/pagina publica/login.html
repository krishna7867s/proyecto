<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Dali Medica</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f5f7fb}
    .page{max-width:420px;margin:80px auto;padding:24px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
    h1{margin:0 0 18px;font-size:24px;color:#1a73e8}
    label{display:block;margin-bottom:8px;font-weight:600}
    input{width:100%;padding:10px;margin-bottom:16px;border:1px solid #ccc;border-radius:8px}
    button{width:100%;padding:12px;border:none;border-radius:8px;background:#1a73e8;color:#fff;font-size:16px;cursor:pointer}
    p{margin:12px 0 0;color:#333}
    .link{margin-top:14px;font-size:14px;color:#555}
    .error{color:#c00;font-weight:700}
  </style>
</head>
<body>
  <div class="page">
    <h1>Iniciar sesión</h1>
    <form id="formLogin">
      <label for="usuario">Usuario o correo electrónico</label>
      <input id="usuario" type="text" required>
      <label for="password">Contraseña</label>
      <input id="password" type="password" required>
      <button type="submit">Entrar</button>
      <p id="mensajeError" class="error" aria-live="polite" style="display:none"></p>
    </form>
    <p class="link">¿No tienes cuenta? <a href="crear_usuario.html">Crear usuario</a></p>
  </div>

  <footer style="margin-top:40px;padding:24px 20px;background:#f7f7f7;border-top:1px solid #e0e0e0;color:#555;max-width:1200px;margin-left:auto;margin-right:auto;">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:flex-start;">
      <div style="flex:1;min-width:260px;padding-left:8px;">
        <h3 style="margin:0 0 10px;color:#1a73e8;">Suscríbete a noticias</h3>
        <p style="margin:0 0 10px;">Recibe novedades, promociones y actualizaciones de Dali Medica.</p>
        <form>
          <label for="newsletter-email-login" style="display:block;margin-bottom:6px;font-weight:600;">Correo electrónico</label>
          <input id="newsletter-email-login" type="email" placeholder="Tu correo" required style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;">
          <button type="submit" style="margin-top:8px;padding:8px 12px;border:none;border-radius:6px;background:#1a73e8;color:#fff;cursor:pointer;">Registrarme</button>
        </form>
      </div>
      <div style="flex:1;min-width:260px;">
        <h3 style="margin:0 0 10px;color:#1a73e8;">Contáctanos</h3>
        <p style="margin:0 0 6px;"><strong>Teléfonos:</strong> +506 2222-3333 / +506 8888-9999</p>
        <p style="margin:0 0 6px;"><strong>Correo:</strong> contacto@dalimedica.com</p>
        <p style="margin:0;">Centro Médico Dali Medica · San José, Costa Rica</p>
      </div>
    </div>
  </footer>

  <script src="../../Pagina-JS/auth.js"></script>
</body>
</html>
