<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contactos - Dali Medica</title>
  <link rel="stylesheet" href="pagina-css/estilos.css">
</head>
<body>
  <header>
    <div class="logo">dali medica</div>
    <nav>
      <ul style="list-style:none;display:flex;gap:16px;margin:0;padding:0;">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contactos.html">Contactos</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>Contáctanos</h1>
    <form id="contactForm">
      <label for="contact-name">Nombre</label>
      <input id="contact-name" required>
      <label for="contact-email">Correo</label>
      <input id="contact-email" type="email" required>
      <label for="contact-message">Mensaje</label>
      <textarea id="contact-message" rows="5" required></textarea>
      <button style="margin-top:12px;padding:8px 12px">Enviar</button>
    </form>
  </main>
  <footer>
    <p style="text-align:center;margin:0;padding:18px 24px;background:#f7f7f7;color:#666;font-size:14px;">&copy; 2026 Dali Medica — Página pública</p>
  </footer>
  <script src="pagina-css/contactos.js"></script>
</body>
</html>
