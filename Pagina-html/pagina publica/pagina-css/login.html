<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - Dali Medica</title>
   <link rel="stylesheet" href="../pagina-css/estilos.css">
  
  <style>
    .login-wrapper {
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(20px);
      box-shadow: var(--glow-intel);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .login-card:hover {
      border-color: rgba(0, 199, 253, 0.5);
      box-shadow: 0 0 40px rgba(0, 199, 253, 0.4), 0 0 80px rgba(147, 51, 234, 0.2);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-size: 2rem;
      color: var(--text-bright);
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .login-card form {
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
      max-width: 100%;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .login-card label {
      display: block;
      color: var(--accent-cyan);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .login-card input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      color: #ffffff;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .login-card input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 199, 253, 0.3);
    }

    .login-card button {
      width: 100%;
      margin-top: 1.2rem;
      padding: 1rem;
      background: var(--brand-gradient);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 0 20px rgba(0, 104, 181, 0.4);
    }

    .login-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 199, 253, 0.6);
    }

    .login-footer-links {
      text-align: center;
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .login-footer-links a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 700;
      transition: var(--transition);
    }

    .login-footer-links a:hover {
      text-shadow: 0 0 10px rgba(0, 199, 253, 0.6);
      text-decoration: underline;
    }

    .error-msg {
      color: #ff4d4d;
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.3);
      padding: 0.8rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">dali medica</div>
    <nav>
      <ul style="list-style:none;display:flex;gap:16px;margin:0;padding:0;">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contactos.html">Contactos</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main class="container login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1>Acceso Institucional</h1>
        <p>Ingresa tus credenciales para acceder a la plataforma de gestión médica.</p>
      </div>

      <form id="formLogin">
        <div class="form-group">
          <label for="usuario">Correo o Usuario</label>
          <input id="usuario" type="email" placeholder="usuario@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>

        <button type="submit">Iniciar Sesión</button>
        <p id="mensajeError" class="error-msg" aria-live="polite" style="display:none"></p>
      </form>

      <div class="login-footer-links">
        ¿No tienes cuenta? <a href="crear_usuario.html">Crear usuario</a>
      </div>
    </div>
  </main>

  <footer>
    <p style="text-align:center;margin:0;padding:18px 24px;background:#f7f7f7;color:#666;font-size:14px;">&copy; 2026 Dali Medica — Página pública</p>
  </footer>

  <script src="pagina-css/storage.js"></script>
  <script src="pagina-css/auth.js"></script>
</body>
</html>
